<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
    .card-header { background-color: #198754; color: white; }
    .section-title { font-weight: bold; color: #198754; border-bottom: 2px solid #198754; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; }
  </style>
</head>
<body>
<div class="container my-4" style="max-width: 800px;">
  <div class="card shadow-sm">
    <div class="card-header text-center py-3">
      <h5 class="mb-1">แบบสำรวจสภาพปัจจุบัน ปัญหาการบริหารจัดการพื้นที่ และโครงสร้างรายจ่าย</h5>
      <small>งานวิจัย: การพัฒนารูปแบบการบริหารจัดการพื้นที่ศูนย์ศึกษาและพัฒนาชุมชนลำปางสู่ต้นแบบการพึ่งตนเองอย่างยั่งยืนตามหลักปรัชญาของเศรษฐกิจพอเพียง</small>
    </div>
    <div class="card-body p-4">
      <form id="surveyForm" onsubmit="submitSurvey(event)">
        
        <!-- ข้อมูลทั่วไป -->
        <div class="section-title">๑. ข้อมูลทั่วไป</div>
        <div class="mb-3">
          <label class="form-label">๑. ชื่อผู้ทำแบบสำรวจ <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="name" required placeholder="ชื่อ-นามสกุล">
        </div>

        <div class="mb-3">
          <label class="form-label">๒. โซนที่รับผิดชอบ <span class="text-danger">*</span></label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="zone" value="๒.๑ พื้นที่ฐานการเรียนรู้และบริเวณใกล้เคียง" required id="z1">
            <label class="form-check-label" for="z1">๒.๑ พื้นที่ฐานการเรียนรู้และบริเวณใกล้เคียง</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="zone" value="๒.๒ พื้นที่ส่วนกลาง" id="z2">
            <label class="form-check-label" for="z2">๒.๒ พื้นที่ส่วนกลาง</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="zone" value="๒.๓ พื้นที่อาคาร" id="z3">
            <label class="form-check-label" for="z3">๒.๓ พื้นที่อาคาร</label>
          </div>
        </div>

        <!-- การวิเคราะห์โครงสร้างรายจ่าย -->
        <div class="section-title">๓. การวิเคราะห์โครงสร้างรายจ่ายและผลผลิต</div>
        
        <div class="mb-3">
          <label class="form-label fw-bold">๓.๑ จำนวนต้นไม้ แต่ละชนิด ในเฉพาะเขตรับผิดชอบ (ระบุชนิดและจำนวน)</label>
          <div class="row g-2 mb-2">
            <div class="col-md-6"><input type="text" class="form-control" name="tree1" placeholder="ชนิดที่ 1 (เช่น ไม้สัก 20 ต้น)"></div>
            <div class="col-md-6"><input type="text" class="form-control" name="tree2" placeholder="ชนิดที่ 2"></div>
            <div class="col-md-6"><input type="text" class="form-control" name="tree3" placeholder="ชนิดที่ 3"></div>
            <div class="col-md-6"><input type="text" class="form-control" name="tree4" placeholder="ชนิดที่ 4"></div>
            <div class="col-md-6"><input type="text" class="form-control" name="tree5" placeholder="ชนิดที่ 5"></div>
          </div>
          <textarea class="form-control" name="tree_other" rows="2" placeholder="อื่นๆ หากมีมากกว่า 5 ชนิด (ระบุชนิดและจำนวน)"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">๓.๒ ต้นทุนค่าดูแล หรือบำรุงรักษา ในพื้นที่รับผิดชอบ รายเดือน (บาท/เดือน) <span class="text-danger">*</span></label>
          <input type="number" class="form-control" name="maintenance_cost" required placeholder="ระบุตัวเลขจำนวนเงิน เช่น 3500">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">๓.๓ ผลผลิตจากเขตพื้นที่รับผิดชอบ (ระบุผลผลิตและจำนวน/ปริมาณ)</label>
          <div class="row g-2 mb-2">
            <div class="col-md-6"><input type="text" class="form-control" name="prod1" placeholder="ผลผลิตที่ 1 (เช่น กล้วย 30 หวี)"></div>
            <div class="col-md-6"><input type="text" class="form-control" name="prod2" placeholder="ผลผลิตที่ 2"></div>
            <div class="col-md-6"><input type="text" class="form-control" name="prod3" placeholder="ผลผลิตที่ 3"></div>
            <div class="col-md-6"><input type="text" class="form-control" name="prod4" placeholder="ผลผลิตที่ 4"></div>
            <div class="col-md-6"><input type="text" class="form-control" name="prod5" placeholder="ผลผลิตที่ 5"></div>
          </div>
          <textarea class="form-control" name="prod_other" rows="2" placeholder="อื่นๆ หากมีมากกว่า 5 รายการ"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">๓.๔ รายได้จากเขตพื้นที่รับผิดชอบ และแหล่งที่มา</label>
          <div class="row g-2 mb-2">
            <div class="col-md-4"><input type="text" class="form-control" name="income1" placeholder="รายการที่ 1 (จำนวนเงิน - แหล่งที่มา)"></div>
            <div class="col-md-4"><input type="text" class="form-control" name="income2" placeholder="รายการที่ 2"></div>
            <div class="col-md-4"><input type="text" class="form-control" name="income3" placeholder="รายการที่ 3"></div>
          </div>
          <textarea class="form-control" name="income_other" rows="2" placeholder="อื่นๆ หากมีมากกว่า 3 รายการ"></textarea>
        </div>

        <div class="text-center mt-4">
          <button type="submit" id="btnSubmit" class="btn btn-success px-5 py-2">บันทึกข้อมูลแบบสำรวจ</button>
        </div>
      </form>
      <div id="statusMsg" class="mt-3 text-center"></div>
    </div>
  </div>
</div>

<script>
function submitSurvey(e) {
  e.preventDefault();
  const form = document.getElementById('surveyForm');
  const btn = document.getElementById('btnSubmit');
  const status = document.getElementById('statusMsg');
  
  btn.disabled = true;
  btn.innerText = "กำลังบันทึกข้อมูล...";
  status.innerHTML = "";

  const formData = Object.fromEntries(new FormData(form).entries());

  google.script.run
    .withSuccessHandler(function(res) {
      if(res.success) {
        status.innerHTML = '<div class="alert alert-success">บันทึกข้อมูลเรียบร้อยแล้ว ขอบคุณสำหรับการให้ข้อมูล</div>';
        form.reset();
      } else {
        status.innerHTML = '<div class="alert alert-danger">เกิดข้อผิดพลาด: ' + res.error + '</div>';
      }
      btn.disabled = false;
      btn.innerText = "บันทึกข้อมูลแบบสำรวจ";
    })
    .withFailureHandler(function(err) {
      status.innerHTML = '<div class="alert alert-danger">เกิดข้อผิดพลาดในการส่งข้อมูล</div>';
      btn.disabled = false;
      btn.innerText = "บันทึกข้อมูลแบบสำรวจ";
    })
    .processForm(formData);
}
</script>
</body>
</html>
